services:
  postgres:
    image: postgres:15
    restart: always
    env_file:
      - .env
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - dm-tools
    ports:
      - "5432:5432"

  nextjs:
    restart: unless-stopped
    image: node:lts-alpine
    command: ./node_modules/.bin/dotenv -e ../.env -c -- npm run dev
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./frontend:/srv/next:rw
      - public-images-tiles:/srv/next/public/images/tiles/
    working_dir: /srv/next
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - dm-tools

  tiles:
    tty: true
    build: ./tiles
    command: flask --app api/index run -h 0.0.0.0 -p 8001 --debug
    volumes:
      - public-images-tiles:/app/api/public/images/tiles/
    ports:
      - "8001:8001"
    networks:
      - dm-tools

volumes:
  postgres:
  public-images-tiles:

networks:
  dm-tools:
    driver: bridge
